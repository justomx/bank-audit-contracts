# A rule whose `that()` finds no class fails by default in ArchUnit.
#
# That does not work in a template: when the sample slice is removed with `make init`,
# a freshly created service is left without any @Entity class, without a
# @RestController, and without @Transactional, and the corresponding rules would turn
# the build red from the first minute, before a single line is written.
#
# With this, a rule with no matches simply passes. The trade-off is that a typo in a
# package name does not give itself away by itself: if you change BASE_PACKAGE, check
# that the rules are still evaluating classes.
archRule.failOnEmptyShould=false
