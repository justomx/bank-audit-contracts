# A rule whose `that()` finds no class fails by default in ArchUnit.
#
# In this module that default is kept ON (unlike the worker's archunit.properties):
# every rule below is scoped to a package guaranteed non-empty by the module's anchor
# type (AuditContractVersion, ADR-D5). An empty match here means a typo in
# BASE_PACKAGE or a package rename, not an empty skeleton — exactly the failure this
# module's rules exist to catch.
archRule.failOnEmptyShould=true
