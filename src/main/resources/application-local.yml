# ============================================================================
# Local profile — points to the docker-compose containers.
# Activate with: make run   (equivalent to -Dspring-boot.run.profiles=local)
#
# This file IS committed: it has no real secrets, only credentials for the
# local containers.
# ============================================================================
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/template
    username: postgres
    password: postgres
  data:
    redis:
      host: localhost
      port: 6379

logging:
  level:
    com.justo.bank: DEBUG
    org.hibernate.SQL: DEBUG
