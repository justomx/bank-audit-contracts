# ============================================================================
# Base configuration — applies to ALL environments.
#
# RULE: nothing sensitive is written here. Every secret comes in through an
# environment variable, which in EKS comes from AWS Secrets Manager. A default
# value in this file is only acceptable if it is harmless in production.
# ============================================================================
spring:
  application:
    # INIT: scripts/init-repo.sh replaces this name
    name: bank-template-vertical-bank

  # Virtual threads (Java 21). Each request runs on a virtual thread, so blocking
  # code scales without needing reactive programming.
  # See docs/adr/0002-mvc-virtual-threads.md
  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/template}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:2}
      connection-timeout: 30000

  jpa:
    hibernate:
      # NEVER change to update or create. The schema is governed by Flyway.
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    # Each service owns its own schema. See README > Database.
    default-schema: ${DB_SCHEMA:public}
    schemas: ${DB_SCHEMA:public}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

  cache:
    type: redis

app:
  cache:
    ttl-seconds: ${CACHE_TTL_SECONDS:300}

server:
  port: 8080
  shutdown: graceful
  # Platform convention: all routes under /api.
  # With management.endpoints.web.base-path set to "/", health ends up at /api/health.
  servlet:
    context-path: /api

# Contract with the platform: separate liveness and readiness.
# Kubernetes restarts the pod if liveness fails; it only pulls it out of the load
# balancer if readiness fails.
management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

# Swagger is turned off outside development environments.
springdoc:
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui.html

logging:
  level:
    root: ${LOG_LEVEL:INFO}
