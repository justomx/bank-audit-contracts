# ============================================================================
# COMPLETE configuration for the: local environment
#
# The platform's runner image copies conf/ to application/ and takes the
# environment configuration from here. The file is complete on purpose: it does
# not depend on the application.yml packaged in the jar also being loaded.
#
# No secret is written here: everything comes in through an environment variable.
# ============================================================================
server:
  port: 8080
  shutdown: graceful
  servlet:
    context-path: /api

spring:
  application:
    name: bank-template-vertical-bank
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/template}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  flyway:
    enabled: true
    default-schema: ${DB_SCHEMA:public}
    schemas: ${DB_SCHEMA:public}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  cache:
    type: redis

app:
  cache:
    ttl-seconds: ${CACHE_TTL_SECONDS:300}

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.justo.bank: DEBUG
