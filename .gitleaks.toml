# gitleaks configuration (TDC-001).
# Extends the default rule set and adds this domain's own rules.

[extend]
useDefault = true

[[rules]]
id = "evertec-basic-auth"
description = "Evertec / SISCARD web service credentials"
regex = '''(?i)(DUMMYWS|PRODWS)[0-9]{3}'''
tags = ["evertec", "credential"]

[[rules]]
id = "pan-tarjeta"
description = "Possible card number (PAN) in the code"
# 13 to 19 digits, with or without separators. See docs/SECURITY.md.
regex = '''\b(?:4[0-9]{12}(?:[0-9]{3})?|5[1-5][0-9]{14}|3[47][0-9]{13})\b'''
tags = ["pci", "pan"]

[[rules]]
id = "llave-aes-evertec"
description = "Evertec field-encryption AES key"
regex = '''(?i)(aes[_-]?key|llave[_-]?aes)\s*[:=]\s*["'][A-Za-z0-9+/=]{16,}["']'''
tags = ["pci", "crypto"]

[allowlist]
description = "Paths where false positives are expected"
paths = [
    '''(.*?)(png|jpg|jpeg|gif|svg|pdf)$''',
    '''^docs/.*\.md$''',
]
# Vendor-documented test data: not real secrets.
regexes = [
    '''4321432100340001''',
]
