# Local infrastructure. Development only: none of this resembles production,
# where Postgres is RDS and Redis is ElastiCache.
services:
  postgres:
    image: postgres:17-alpine
    container_name: template-postgres
    environment:
      POSTGRES_DB: template
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    # WATCH OUT for the version. In ElastiCache the engine is called "Redis OSS 7.1",
    # but Redis OSS never published a 7.1: it went from 7.0 to 7.2, and the image
    # redis:7.1 does not exist. ElastiCache's 7.1 is COMPATIBLE with Redis OSS 7.0, so
    # 7.0 is used locally.
    #
    # It is deliberately not bumped to 7.2: local must never be newer than production,
    # or you end up using a command that does not exist in the real environment.
    image: redis:7.0-alpine
    container_name: template-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Only needed if the service uses SQS, SNS, DynamoDB, or Secrets Manager.
  # Start it separately with `make localstack-up`, not with `make infra-up`.
  localstack:
    image: localstack/localstack:latest
    container_name: template-localstack
    environment:
      SERVICES: sqs,sns,dynamodb,secretsmanager
      DEBUG: 0
    ports:
      - "4566:4566"
    profiles: ["aws"]

volumes:
  postgres-data:
