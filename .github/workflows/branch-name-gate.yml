# Workflow human-readable name shown in Actions UI.
# MUST stay verbatim — branch protection SDD references it as required check.
name: Branch Name Gate

# Trigger on PRs against master, develop OR release/* branches.
# Drafts included.
on:
  pull_request:
    branches:
      - master
      - develop
      - "release/*"

# Least privilege — workflow reads github.head_ref/base_ref only, never
# touches repo or API. Empty = zero scopes.
permissions: {}

# Cancel stale runs when new commits land on the same PR.
concurrency:
  group: branch-name-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job id == check run name on the PR. MUST stay 'validate-branch-name'
  # verbatim — registered as required check in branch protection.
  validate-branch-name:
    name: validate-branch-name
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch name against target-aware allow-list
        # Pass head_ref AND base_ref via env to neutralize shell
        # metacharacters in attacker-controlled branch names.
        # NEVER inline ${{ ... }} into bash.
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          # GitFlow strict policy — three tiers:
          #
          # master accepts ONLY:
          #   - release/*    (planned releases from develop)
          #   - hotfix/*     (urgent fixes direct to prod)
          #   - revert-N-*   (GitHub auto-revert button)
          #   - dependabot/* (dependency updates, incl. CVEs)
          #
          # release/* accepts ONLY:
          #   - hotfix/*     (fixes to a pending release before merging to master)
          #
          # develop accepts the full allow-list (feature branches, fixes,
          # chores, docs, backports, etc.)
          #
          # Each branch anchored with ^ because | has lowest precedence
          # in ERE — without re-anchoring, the rest would match anywhere.

          if [ "$BASE_REF" = "master" ]; then
            ALLOWED_REGEX='^release/.+|^hotfix/.+|^revert-[0-9]+-.+|^dependabot/.+'
            TARGET_TIER='master'
          elif [[ "$BASE_REF" =~ ^release/ ]]; then
            ALLOWED_REGEX='^hotfix/.+'
            TARGET_TIER='release'
          else
            ALLOWED_REGEX='^(feature|feat|fix|bugfix|chore|hotfix|docs|refactor|ci|release)/.+|^revert-[0-9]+-.+|^dependabot/.+|^backport/.+'
            TARGET_TIER='develop'
          fi

          if [[ "$HEAD_REF" =~ $ALLOWED_REGEX ]]; then
            echo "PASS: branch '$HEAD_REF' is allowed to target '$BASE_REF'."
            exit 0
          fi

          echo "FAIL: branch '$HEAD_REF' is NOT allowed to target '$BASE_REF'."
          echo ""
          case "$TARGET_TIER" in
            master)
              echo "GitFlow policy: master only accepts release, hotfix, revert and dependabot branches."
              echo ""
              echo "Allowed prefixes for master:"
              echo "  - release/<desc>      (planned release from develop)"
              echo "  - hotfix/<desc>       (urgent fix direct to prod)"
              echo "  - revert-<N>-<desc>   (auto-generated by GitHub Revert button)"
              echo "  - dependabot/<...>    (auto-generated by Dependabot)"
              echo ""
              echo "If you intended to merge feature work, target 'develop' instead."
              echo "When ready to release, create a release/<desc> branch from develop"
              echo "and open the PR against master."
              ;;
            release)
              echo "GitFlow policy: release/* branches only accept hotfix/* PRs."
              echo ""
              echo "Allowed prefixes for release/*:"
              echo "  - hotfix/<desc>       (fix to apply to a pending release before merging to master)"
              echo ""
              echo "If you need to add features to a release, work in develop instead."
              echo "Release branches are stabilization-only — no new functionality after creation."
              ;;
            develop)
              echo "Allowed prefixes for develop:"
              echo "  - feature/<desc>, feat/<desc>"
              echo "  - fix/<desc>, bugfix/<desc>"
              echo "  - chore/<desc>"
              echo "  - hotfix/<desc>"
              echo "  - docs/<desc>"
              echo "  - refactor/<desc>"
              echo "  - ci/<desc>"
              echo "  - release/<desc>"
              echo "  - backport/<desc>"
              echo "  - revert-<N>-<desc>"
              echo "  - dependabot/<...>"
              ;;
          esac
          echo ""
          echo "Example: hotfix/LM-456-patch-payment-bug"
          echo ""
          echo "Rename your branch and push it; the check will re-run."
          exit 1
