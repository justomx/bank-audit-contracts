# Workflow human-readable name shown in Actions UI.
# MUST stay verbatim — branch protection references it as required check.
name: Branch Name Gate

# Trigger on PRs against main OR release/* branches. Drafts included.
on:
  pull_request:
    branches:
      - main
      - "release/*"

# Least privilege — workflow reads github.head_ref/base_ref only, never
# touches repo or API. Empty = zero scopes.
permissions: {}

# Cancel stale runs when new commits land on the same PR.
concurrency:
  group: branch-name-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job id == check run name on the PR. MUST stay 'validate-branch-name'
  # verbatim — registered as required check in branch protection.
  validate-branch-name:
    name: validate-branch-name
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch name against target-aware allow-list
        # Pass head_ref AND base_ref via env to neutralize shell
        # metacharacters in attacker-controlled branch names.
        # NEVER inline ${{ ... }} into bash.
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          # Trunk-based development — two tiers:
          #
          # main is the trunk. It is the only long-lived branch, it deploys to
          # the test environments, and it accepts the full allow-list: short
          # lived branches that merge back quickly.
          #
          # release/* is cut from main when something goes to production. It is
          # stabilization only, so it accepts nothing that adds functionality.
          #
          # There is no develop branch. Justo uses trunk-based development.
          #
          # Each alternative anchored with ^ because | has lowest precedence
          # in ERE — without re-anchoring, the rest would match anywhere.

          if [[ "$BASE_REF" =~ ^release/ ]]; then
            ALLOWED_REGEX='^hotfix/.+|^fix/.+|^bugfix/.+|^revert-[0-9]+-.+'
            TARGET_TIER='release'
          else
            ALLOWED_REGEX='^(feature|feat|fix|bugfix|chore|hotfix|docs|refactor|ci|release)/.+|^revert-[0-9]+-.+|^dependabot/.+|^backport/.+'
            TARGET_TIER='main'
          fi

          if [[ "$HEAD_REF" =~ $ALLOWED_REGEX ]]; then
            echo "PASS: branch '$HEAD_REF' is allowed to target '$BASE_REF'."
            exit 0
          fi

          echo "FAIL: branch '$HEAD_REF' is NOT allowed to target '$BASE_REF'."
          echo ""
          case "$TARGET_TIER" in
            release)
              echo "release/* branches are stabilization-only: no new functionality"
              echo "after the branch is cut."
              echo ""
              echo "Allowed prefixes for release/*:"
              echo "  - hotfix/<desc>       (urgent fix for the pending release)"
              echo "  - fix/<desc>, bugfix/<desc>"
              echo "  - revert-<N>-<desc>   (auto-generated by GitHub Revert button)"
              echo ""
              echo "New functionality goes to main and ships in the next release."
              ;;
            main)
              echo "Allowed prefixes for main:"
              echo "  - feature/<desc>, feat/<desc>"
              echo "  - fix/<desc>, bugfix/<desc>"
              echo "  - chore/<desc>"
              echo "  - hotfix/<desc>"
              echo "  - docs/<desc>"
              echo "  - refactor/<desc>"
              echo "  - ci/<desc>"
              echo "  - release/<desc>"
              echo "  - backport/<desc>"
              echo "  - revert-<N>-<desc>"
              echo "  - dependabot/<...>"
              ;;
          esac
          echo ""
          echo "Example: fix/LM-456-patch-payment-bug"
          echo ""
          echo "Rename your branch and push it; the check will re-run."
          exit 1
